site_name: ASCENT III Telemetry Firmware
site_description: Firmware and library reference for the ASCENT III telemetry system
site_url: https://spaceflight-rocketry-giessen-e-v.github.io/Telemetry/
repo_url: https://github.com/Spaceflight-Rocketry-Giessen-e-V/Telemetry
repo_name: Spaceflight-Rocketry-Giessen-e-V/Telemetry
docs_dir: docs
site_dir: site
remote_name: origin
remote_branch: gh-pages

exclude_docs: |
  README.md
  design_overview.md
  helical_antenna_assembly_manual.md
  helical_antenna_design_guide.ipynb
  helical_antenna_simulation_guide.md
  images/
  linkbudget.ipynb
  operations_cheatsheet.md
  packet_structure.md
  qfh_antenna_cad_tutorial.md
  user_manual.md

theme:
  name: material
  font:
    text: Montserrat

  palette:

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: red
      accent: deep purple
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  social:
    - icon: fontawesome/solid/satellite-dish
      link: https://sprog-ev.de/
      name: Spaceflight Rocketry Gießen e.V.

plugins:
  - search
  - tags
  - mkdoxy:
      projects:
        onboard:
          src-dirs: onboard/firmware/include onboard/firmware/src
          full-doc: true
          doxy-cfg:
            FILE_PATTERNS: "*.h *.hpp *.cpp"
            RECURSIVE: true
            EXTRACT_ALL: true
        groundstation:
          src-dirs: groundstation/firmware/include groundstation/firmware/src
          full-doc: true
          doxy-cfg:
            FILE_PATTERNS: "*.h *.hpp *.cpp"
            RECURSIVE: true
            EXTRACT_ALL: true
        packet:
          src-dirs: libraries/DynamicPacketCodec/include libraries/DynamicPacketCodec/src
          full-doc: true
          doxy-cfg:
            FILE_PATTERNS: "*.h *.hpp *.cpp"
            RECURSIVE: true
            EXTRACT_ALL: true
        radiocrafts:
          src-dirs: libraries/Radiocrafts_RC17xxHP_RC232
          full-doc: true
          doxy-cfg:
            FILE_PATTERNS: "*.h *.hpp *.cpp"
            RECURSIVE: true
            EXTRACT_ALL: true

nav:
  - Home: index.md
  - Firmware:
      - Onboard:
          - Functions: onboard/group__onboard.md
          - Classes: onboard/annotated.md
          - Files: onboard/files.md
      - Ground station:
          - Functions: groundstation/group__groundstation.md
          - Classes: groundstation/annotated.md
          - Files: groundstation/files.md
  - Libraries:
      - Packet:
          - Class reference: packet/annotated.md
          - Files: packet/files.md
      - Radiocrafts RC17xxHP-RC232:
          - Class reference: radiocrafts/annotated.md
          - Files: radiocrafts/files.md

markdown_extensions:
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - tables
  - toc
