site_name: ASCENT Rocket Telemetry Firmware
site_description: Firmware and library reference for the ASCENT Rocket Telemetry System
site_url: https://spaceflight-rocketry-giessen-e-v.github.io/Telemetry/
repo_url: https://github.com/Spaceflight-Rocketry-Giessen-e-V/Telemetry
repo_name: Spaceflight-Rocketry-Giessen-e-V/Telemetry
docs_dir: pages
site_dir: site
remote_name: origin
remote_branch: gh-pages

theme:
  name: material
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.path
  favicon: images/cropped-logo_sprog_normal-scaled-1-75x75.png

  font:
    text: Montserrat

  palette:
      scheme: slate
      primary: red
      accent: deep purple

extra:
  social:
    - icon: material/earth
      link: https://sprog-ev.de/en/
      name: Spaceflight Rocketry Gießen e.V.

extra_javascript:
  - javascripts/custom-types.js

plugins:
  - search
  - tags
  - mkdoxy:
      projects:
        onboard:
          src-dirs: onboard/firmware/include onboard/firmware/src
          full-doc: true
          template-dir: .github/mkdocs/templates
          doxy-cfg:
            FILE_PATTERNS: "*.h *.hpp *.c *.cpp"
            RECURSIVE: true
            EXTRACT_ALL: true
        groundstation:
          src-dirs: groundstation/firmware/include groundstation/firmware/src
          full-doc: true
          template-dir: .github/mkdocs/templates
          doxy-cfg:
            FILE_PATTERNS: "*.h *.hpp *.c *.cpp"
            RECURSIVE: true
            EXTRACT_ALL: true
        packet:
          src-dirs: libraries/DynamicPacketCodec/include libraries/DynamicPacketCodec/src
          full-doc: true
          template-dir: .github/mkdocs/templates
          doxy-cfg:
            FILE_PATTERNS: "*.h *.hpp *.c *.cpp"
            RECURSIVE: true
            EXTRACT_ALL: true
        radiocrafts:
          src-dirs: libraries/Radiocrafts_RC17xxHP_RC232
          full-doc: true
          template-dir: .github/mkdocs/templates
          doxy-cfg:
            FILE_PATTERNS: "*.h *.hpp *.c *.cpp"
            RECURSIVE: true
            EXTRACT_ALL: true

nav:
  - Home: index.md
  - Firmware:
      - Onboard:
          - Functions: onboard/group__onboard.md
          - Classes: onboard/annotated.md
          - Files: onboard/files.md
      - Groundstation:
          - Functions: groundstation/group__groundstation.md
          - Classes: groundstation/annotated.md
          - Files: groundstation/files.md
  - Libraries:
      - DynamicPacketCodec:
          - Class reference: packet/annotated.md
          - Files: packet/files.md
      - Radiocrafts RC17xxHP-RC232:
          - Class reference: radiocrafts/annotated.md
          - Files: radiocrafts/files.md

markdown_extensions:
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - tables
  - toc
