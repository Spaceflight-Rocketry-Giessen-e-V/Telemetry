name: KiCad Export

on:
  workflow_dispatch:
  push:
    branches: 
      - main
    paths:
      - 'onboard/pcb/**/*.kicad_*'
      - 'groundstation/pcb/Motherboard/**/*.kicad_*'
      - 'groundstation/pcb/Daughterboard/**/*.kicad_*'
      - '.github/kicad-workflow/export.kicad_jobset'
      - '.github/kicad-workflow/pdf_bom_export.kicad_jobset'
      - '.github/workflows/kicad_export.yml'

permissions: {}

concurrency:
  group: kicad-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:10.0.7
      options: --user root
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Export Gerbers, drill files, schematics, and BOMs
        id: export
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          kicad-cli jobset run --stop-on-error -f '.github/kicad-workflow/export.kicad_jobset' 'onboard/pcb/TelemetryOnboard.kicad_pro'
          kicad-cli jobset run --stop-on-error -f '.github/kicad-workflow/export.kicad_jobset' 'groundstation/pcb/Motherboard/TelemetryGroundstationMB.kicad_pro'
          kicad-cli jobset run --stop-on-error -f '.github/kicad-workflow/export.kicad_jobset' 'groundstation/pcb/Daughterboard/TelemetryGroundstationDB.kicad_pro'
          git add --all
          {
            echo 'changed_files<<EOF'
            git diff --cached --name-only
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish KiCad exports
        if: steps.export.outputs.changed_files != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update KiCad exports'
          git push
